<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Background: Smooth Rounded Superellipse (iOS / Android adaptive shape) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
  
  <!-- Central Emblem: Lightning Bolt & Burger Accent -->
  <g transform="translate(256, 256) scale(0.95)">
    <!-- Burger Top Bun -->
    <path d="M -130 -40 C -130 -110, 130 -110, 130 -40 Z" fill="#fcd34d" />
    <!-- Burger Seeds -->
    <ellipse cx="-50" cy="-70" rx="6" ry="3" fill="#ffffff" opacity="0.8" />
    <ellipse cx="0" cy="-80" rx="6" ry="3" fill="#ffffff" opacity="0.8" />
    <ellipse cx="50" cy="-70" rx="6" ry="3" fill="#ffffff" opacity="0.8" />
    <ellipse cx="-20" cy="-60" rx="6" ry="3" fill="#ffffff" opacity="0.8" />
    <ellipse cx="30" cy="-60" rx="6" ry="3" fill="#ffffff" opacity="0.8" />
    
    <!-- Cheese Layer -->
    <polygon points="-125,-30 125,-30 80,0 -10,-10 -90,5" fill="#f59e0b" />
    
    <!-- Patty -->
    <rect x="-120" y="-15" width="240" height="32" rx="16" fill="#78350f" />
    
    <!-- Fresh Lettuce -->
    <path d="M -130 18 Q -100 28, -70 18 Q -40 28, -10 18 Q 20 28, 50 18 Q 80 28, 110 18 Q 125 24, 130 18 L 130 26 Q 100 36, 70 26 Q 40 36, 10 26 Q -20 36, -50 26 Q -80 36, -110 26 Q -125 32, -130 26 Z" fill="#22c55e" />
    
    <!-- Burger Bottom Bun -->
    <path d="M -125 34 C -125 75, 125 75, 125 34 Z" fill="#fcd34d" />
    
    <!-- Vivid Lightning Bolt overlaying -->
    <polygon points="25,-140 -45,-15 10,-15 -25,120 70,-10 15,-10" fill="#ffffff" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.25))" />
    <polygon points="25,-140 -45,-15 10,-15 -25,120 70,-10 15,-10" fill="#fef08a" />
  </g>
</svg>
